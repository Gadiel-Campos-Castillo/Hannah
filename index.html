<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Menú Interactivo para Hannah</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #111;
            overflow: hidden;
            font-family: sans-serif;
        }
        #gameContainer {
            position: relative;
            width: 100%;
            height: 100%;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #actionPrompt {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 12px 25px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 18px;
            display: none;
            pointer-events: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 2px solid #fff;
            z-index: 5;
        }
        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .modal-content {
            background: #1a1a1a;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            width: 90%;
            height: 85%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 30px rgba(250, 250, 250, 0.1);
        }
        iframe, video {
            flex-grow: 1;
            width: 100%;
            height: 100%;
            border: none;
            background: white;
            border-radius: 8px;
        }
        video { background: #000; }
        .close-btn {
            background: #ff3366;
            color: white;
            border: none;
            padding: 10px 24px;
            margin-top: 15px;
            cursor: pointer;
            border-radius: 6px;
            font-weight: bold;
            align-self: center;
        }

        @media (max-width: 768px) {
            .modal-content {
                width: 95%;
                height: 75%;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
   
<div id="gameContainer">
    <div id="actionPrompt">Presiona "E" para entrar</div>
    
    <div id="videoModal" class="modal">
        <div class="modal-content">
            <video controls id="demoVideo">
                <source src="Hannah.mp4" type="video/mp4">
            </video>
            <button class="close-btn" onclick="closeModal()">Cerrar [Esc]</button>
        </div>
    </div>

    <div id="htmlModal" class="modal">
        <div class="modal-content">
            <iframe id="hannahIframe" src=""></iframe>
            <button class="close-btn" onclick="closeHtmlModal()">Cerrar [Esc]</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>
</div>

<script src="Player.js"></script>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const actionPrompt = document.getElementById('actionPrompt');
const videoModal = document.getElementById('videoModal');
const demoVideo = document.getElementById('demoVideo');
const htmlModal = document.getElementById('htmlModal');
const hannahIframe = document.getElementById('hannahIframe');

const RUTA_PAGINA_HANNAH = "main.html"; 

// Carga de la Imagen de Fondo
const backgroundImage = new Image();
backgroundImage.src = 'assets/mi fondo.jpg';

// Carga de Imágenes para los Portales
const portalImageVideo = new Image();
portalImageVideo.src = 'assets/portal_video.png'; // Cambia por tu archivo PNG

const portalImageWeb = new Image();
portalImageWeb.src = 'assets/portal_web.png';     // Cambia por tu archivo PNG


let sueloY = 0;
let inModal = false;
let activeModalElement = null;

// Instanciar al jugador usando la clase externa
const personaje = new Player(100, -90);

// Portales interactivos
const portals = [
    { id: 'video', x: 200, y: 0, width: 140, height: 200, label: 'Demostración', image: portalImageVideo },
    { id: 'web_original', x: 600, y: 0, width: 140, height: 200, label: 'Web Hannah', image: portalImageWeb }
];

// Se añaden los mapeos lógicos para el salto (up y jump)
const keys = { right: false, left: false, up: false, jump: false, w: false };

// Detectar si el usuario está en un dispositivo móvil
const esMovil = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

// Definición de botones táctiles en pantalla (coordenadas temporales, se ajustan en resizeCanvas)
const botonesTactiles = {
    izq: { x: 20, y: 0, w: 70, h: 70, label: '◀' },
    der: { x: 110, y: 0, w: 70, h: 70, label: '▶' },
    saltar: { x: 0, y: 0, w: 80, h: 70, label: 'SALTO' },
    entrar: { x: 0, y: 0, w: 80, h: 70, label: 'E' }
};

// Añade esta variable global arriba en tu script principal
let escalaMobile = 1; 

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    
    // Dejamos un estándar responsivo cómodo para todos
    sueloY = canvas.height - (canvas.height*0.14);
    
    // Ajuste de escala intermedio que se ve bien en laptops y móviles
    const anchoPantalla = window.innerWidth;
    escalaMobile = anchoPantalla < 768 ? 0.6 : 0.85; 

    personaje.width = 96 * escalaMobile;  
    personaje.height = 96 * escalaMobile; 

    portals.forEach(portal => {
        portal.width = 140 * escalaMobile;
        portal.height = 200 * escalaMobile;
    });
    
    personaje.sueloY = sueloY - personaje.height;
    if (!personaje.isJumping) {
        personaje.y = personaje.sueloY;
        personaje.dy = 0;
    }

    // --- Botones Virtuales Disponibles para Todos ---
    const altoBoton = 55;
    const padding = 20;
    
    botonesTactiles.izq.w = 60; botonesTactiles.izq.h = 55;
    botonesTactiles.der.w = 60; botonesTactiles.der.h = 55;
    botonesTactiles.saltar.w = 80; botonesTactiles.saltar.h = 55;
    botonesTactiles.entrar.w = 65; botonesTactiles.entrar.h = 55;

    botonesTactiles.izq.x = padding;
    botonesTactiles.izq.y = canvas.height - altoBoton - padding;
    
    botonesTactiles.der.x = padding + 70;
    botonesTactiles.der.y = canvas.height - altoBoton - padding;

    botonesTactiles.entrar.x = canvas.width - 160 - padding;
    botonesTactiles.entrar.y = canvas.height - altoBoton - padding;
    
    botonesTactiles.saltar.x = canvas.width - 80 - padding;
    botonesTactiles.saltar.y = canvas.height - altoBoton - padding;
}

window.addEventListener('resize', resizeCanvas);

// Captura de teclado mapeada para el motor de animaciones completo
document.addEventListener('keydown', (e) => {
    if (inModal) {
        if (e.key === 'Escape') {
            if (activeModalElement === 'video') closeModal();
            if (activeModalElement === 'html') closeHtmlModal();
        }
        return;
    }
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
    
    // Mapeo de controles de salto
    if (e.key === 'ArrowUp') keys.up = true;
    if (e.key === ' ') keys.jump = true;
    if (e.key === 'w' || e.key === 'W') keys.w = true;

    if (e.key === 'e' || e.key === 'E') checkInteractions();
});

document.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
    
    // Resetear controles de salto
    if (e.key === 'ArrowUp') keys.up = false;
    if (e.key === ' ') keys.jump = false;
    if (e.key === 'w' || e.key === 'W') keys.w = false;
});

// Manejo de toques en pantallas táctiles
if (esMovil) {
    canvas.addEventListener('touchstart', (e) => {
        if (inModal) return;
        const toque = e.touches[0];
        const rect = canvas.getBoundingClientRect();
        const touchX = toque.clientX - rect.left;
        const touchY = toque.clientY - rect.top;

        // Evaluar qué botón se presionó
        if (evaluarToque(touchX, touchY, botonesTactiles.izq)) keys.left = true;
        if (evaluarToque(touchX, touchY, botonesTactiles.der)) keys.right = true;
        if (evaluarToque(touchX, touchY, botonesTactiles.saltar)) keys.jump = true;
        if (evaluarToque(touchX, touchY, botonesTactiles.entrar)) checkInteractions();
    });

    canvas.addEventListener('touchend', (e) => {
        // Al soltar la pantalla, detenemos todo el movimiento
        keys.left = false;
        keys.right = false;
        keys.jump = false;
    });
}

function evaluarToque(tx, ty, boton) {
    return tx >= boton.x && tx <= boton.x + boton.w && ty >= boton.y && ty <= boton.y + boton.h;
}

function getActivePortal() {
    for (let portal of portals) {
        let pCenter = personaje.x + personaje.width / 2;
        if (pCenter >= portal.x && pCenter <= (portal.x + portal.width)) {
            return portal;
        }
    }
    return null;
}

function checkInteractions() {
    const activePortal = getActivePortal();
    if (activePortal) {
        if (activePortal.id === 'video') openModal();
        if (activePortal.id === 'web_original') openHtmlModal();
    }
}

function openModal() {
    inModal = true;
    activeModalElement = 'video';
    videoModal.style.display = 'flex';
    keys.right = false; keys.left = false; keys.up = false; keys.jump = false; keys.w = false;
    demoVideo.play().catch(()=>{});
}

function closeModal() {
    inModal = false;
    activeModalElement = null;
    videoModal.style.display = 'none';
    demoVideo.pause();
}

// Abre la vista HTML limpiando el estado de entrada
function openHtmlModal() {
    inModal = true;
    activeModalElement = 'html';
    hannahIframe.src = RUTA_PAGINA_HANNAH;
    htmlModal.style.display = 'flex';
    keys.right = false; keys.left = false; keys.up = false; keys.jump = false; keys.w = false;
}

function closeHtmlModal() {
    inModal = false;
    activeModalElement = null;
    htmlModal.style.display = 'none';
    hannahIframe.src = ""; 
}


// --- FUNCIÓN DE CONTROL COMPARTIDA ---
function procesarAccionPresionada(clientX, clientY) {
    if (inModal) return;
    const rect = canvas.getBoundingClientRect();
    const x = clientX - rect.left;
    const y = clientY - rect.top;

    if (evaluarToque(x, y, botonesTactiles.izq)) keys.left = true;
    if (evaluarToque(x, y, botonesTactiles.der)) keys.right = true;
    if (evaluarToque(x, y, botonesTactiles.saltar)) keys.jump = true;
    if (evaluarToque(x, y, botonesTactiles.entrar)) checkInteractions();
}

function procesarAccionSoltada() {
    keys.left = false;
    keys.right = false;
    keys.jump = false;
}

// Eventos para Computadoras (Mac/Windows) usando el Mouse o Trackpad
canvas.addEventListener('mousedown', (e) => procesarAccionPresionada(e.clientX, e.clientY));
canvas.addEventListener('mouseup', procesarAccionSoltada);

// Eventos para Celulares (Android/iOS) usando la pantalla táctil
canvas.addEventListener('touchstart', (e) => {
    const toque = e.touches[0];
    procesarAccionPresionada(toque.clientX, toque.clientY);
});
canvas.addEventListener('touchend', procesarAccionSoltada);

// Inicialización de dimensiones antes de arrancar
resizeCanvas();

// Game Loop
function update() {
    if (!inModal) {
        // Se le pasa la variable sueloY para sincronizar la gravedad con el Canvas dinámico
        personaje.update(keys, canvas.width, sueloY);

        const activePortal = getActivePortal();
        if (activePortal) {
            actionPrompt.innerText = `Presiona "E" para abrir: ${activePortal.label}`;
            actionPrompt.style.display = 'block';
        } else {
            actionPrompt.style.display = 'none';
        }
    }

    render();
    requestAnimationFrame(update);
}

function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. Dibujar imagen de fondo adaptada al tamaño del navegador
    if (backgroundImage.complete) {
        ctx.drawImage(backgroundImage, 0, 0, canvas.width, canvas.height);
    } else {
        ctx.fillStyle = '#0099ff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // 2. Dibujar Portales sobre el fondo
    portals.forEach(portal => {
        portal.y = sueloY - portal.height - 20; // Ajusta la altura para que asiente en el suelo

        // Dibujar el PNG del portal si ya cargó
        if (portal.image.complete && portal.image.naturalWidth > 0) {
            ctx.imageSmoothingEnabled = false; // Mantiene el pixel art nítido
            ctx.drawImage(portal.image, portal.x, portal.y, portal.width, portal.height);
        } else {
            // Fallback: Si la imagen no carga, muestra el recuadro blanco de respaldo
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.strokeRect(portal.x, portal.y, portal.width, portal.height);
        }

        // --- Configuración del Título ARRIBA del Portal ---
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 16px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom'; // Cambiado a 'bottom' para que se alinee perfectamente desde su base

        // Explicación de la coordenada Y:
        // Tomamos el límite superior del portal (portal.y) y le restamos 12 píxeles 
        // para que el texto flote justo arriba sin pegarse al borde de la imagen.
        ctx.fillText(portal.label, portal.x + portal.width / 2, portal.y - 12);
    });

    // Dibujar controles visuales en pantalla (ayuda a guiar al usuario en Mac y Celulares)
    if (!inModal) {
        ctx.save();
        Object.values(botonesTactiles).forEach(boton => {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.lineWidth = 2;
            
            ctx.beginPath();
            ctx.roundRect(boton.x, boton.y, boton.w, boton.h, 10);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 16px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(boton.label, boton.x + boton.w / 2, boton.y + boton.h / 2);
        });
        ctx.restore();
    }

    // 3. Dibujar al Personaje animado
    personaje.draw(ctx);
}

update();
</script>
</body>
</html>
